[project]
name = "headlock"
version = "0.1.0"
description = "Head-lock stabilization: track a dancer's head and export Premiere Pro (FCP7 XML) motion keyframes"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python",
    "onnxruntime",
    "rtmlib",
]

[project.scripts]
headlock = "headlock.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headlock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
