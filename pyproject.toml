[project]
name = "headlock"
version = "0.1.0"
description = "Head-lock stabilization: track a head and export DaVinci Resolve / Premiere Pro keyframes, or reframe 360 video"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python",
    "onnxruntime",
    "rtmlib",
    "tqdm",
    "faster-whisper>=1.2.1",
]

[project.gui-scripts]
headlock-ui = "headlock.ui:main"

[project.scripts]
headlock = "headlock.cli:main"

[dependency-groups]
dev = ["pytest", "lupa"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headlock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
